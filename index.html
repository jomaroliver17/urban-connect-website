<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Connect TT</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #ddd; }
        header img { max-height: 80px; }
        
        .info-bar { background-color: #007bff; color: white; text-align: center; padding: 10px; font-weight: bold; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .product-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .product-card { background: white; border: 1px solid #eee; padding: 20px; border-radius: 8px; width: 300px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card img { max-width: 100%; height: 250px; object-fit: contain; margin-bottom: 15px; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 800px; max-width: 90%; display: flex; gap: 30px; position: relative; }
        .close { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #666; }
        .close:hover { color: #000; }
        
        .modal-left { flex: 1; text-align: center; background: #f8f9fa; padding: 20px; border-radius: 8px; }
        .modal-left img { max-width: 100%; height: 350px; object-fit: contain; }
        
        .modal-right { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .modal-right h2 { margin-top: 0; font-size: 24px; }
        .modal-right h3 { color: #007bff; font-size: 28px; margin: 10px 0 20px 0; }
        
        .color-options { display: flex; gap: 15px; margin-top: 10px; margin-bottom: 30px; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: 0 0 0 1px #ccc; }
        .color-btn.active { box-shadow: 0 0 0 2px #007bff; }
        
        .btn { display: inline-block; padding: 15px 20px; background: #007bff; color: white; text-align: center; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-size: 16px; font-weight: bold; width: 100%; }
        .btn:hover { background: #0056b3; }
        
        .payment-info { margin-top: 50px; text-align: center; padding: 30px; background: white; border-radius: 8px; border: 1px solid #ddd; }
        .payment-info h3 { margin-top: 0; }
    </style>
</head>
<body>

    <header>
        <img src="WhatsApp Image 2026-07-25 at 6.41.24 PM.jpeg" alt="Urban Connect TT Logo">
    </header>

    <div class="info-bar">
        Shop our latest inventory online
    </div>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px;">Available Phones</h2>
        
        <div class="product-grid" id="productGrid">
            <!-- Products injected by JavaScript -->
        </div>

        <div class="payment-info">
            <h3>Secure Checkout</h3>
            <p>We are fully integrated for <strong>Online Payments</strong>. Check out securely right here on the website.</p>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-left">
                <img id="modalImage" src="" alt="Phone">
            </div>
            <div class="modal-right">
                <h2 id="modalTitle">Phone Title</h2>
                <h3 id="modalPrice">$0</h3>
                
                <div>
                    <strong style="display: block; margin-bottom: 10px;">Color: <span id="colorName" style="font-weight: normal;"></span></strong>
                    <div class="color-options" id="colorContainer">
                        <!-- Colors injected by JavaScript -->
                    </div>
                </div>

                <button class="btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <script>
        // Data updated to correct models and unique placeholder URLs so the images actually change
        const phones = [
            {
                id: '17promax', 
                name: 'iPhone 17 Pro Max', 
                price: 'TT$10,499',
                colors: [
                    { name: 'Black Titanium', hex: '#1C1C1E', img: 'https://placehold.co/400x500/1C1C1E/FFFFFF?text=17+Pro+Max%0ABlack+Titanium' },
                    { name: 'White Titanium', hex: '#F2F1ED', img: 'https://placehold.co/400x500/F2F1ED/000000?text=17+Pro+Max%0AWhite+Titanium' },
                    { name: 'Natural Titanium', hex: '#A8A6A1', img: 'https://placehold.co/400x500/A8A6A1/FFFFFF?text=17+Pro+Max%0ANatural+Titanium' }
                ]
            },
            {
                id: '17pro', 
                name: 'iPhone 17 Pro', 
                price: 'TT$9,599',
                colors: [
                    { name: 'Natural Titanium', hex: '#A8A6A1', img: 'https://placehold.co/400x500/A8A6A1/FFFFFF?text=17+Pro%0ANatural+Titanium' },
                    { name: 'Black Titanium', hex: '#1C1C1E', img: 'https://placehold.co/400x500/1C1C1E/FFFFFF?text=17+Pro%0ABlack+Titanium' },
                    { name: 'White Titanium', hex: '#F2F1ED', img: 'https://placehold.co/400x500/F2F1ED/000000?text=17+Pro%0AWhite+Titanium' }
                ]
            }
        ];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            phones.forEach(phone => {
                const defaultColor = phone.colors[0];
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(phone);
                card.innerHTML = `
                    <img src="${defaultColor.img}" alt="${phone.name}">
                    <h3>${phone.name}</h3>
                    <p style="color: #007bff; font-weight: bold; font-size: 18px; margin: 10px 0;">${phone.price}</p>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(phone) {
            document.getElementById('productModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = phone.name;
            document.getElementById('modalPrice').innerText = phone.price;
            
            // Render the color buttons
            const colorContainer = document.getElementById('colorContainer');
            colorContainer.innerHTML = '';
            
            phone.colors.forEach((color, index) => {
                const btn = document.createElement('div');
                // Set the first color as active by default
                btn.className = index === 0 ? 'color-btn active' : 'color-btn';
                btn.style.backgroundColor = color.hex;
                
                btn.onclick = () => {
                    // Remove active class from all buttons
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    btn.classList.add('active');
                    // Update the image
                    updateModalImage(color);
                };
                colorContainer.appendChild(btn);
            });

            // Set the modal to show the first color by default
            updateModalImage(phone.colors[0]);
        }

        function updateModalImage(colorObj) {
            document.getElementById('modalImage').src = colorObj.img;
            document.getElementById('colorName').innerText = colorObj.name;
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Load the products when the page loads
        renderProducts();
    </script>
</body>
</html>
