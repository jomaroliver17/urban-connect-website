<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Connect TT | Trinidad & Tobago's Trusted Phone Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070D18;
            --bg-navy: #0A1628;
            --primary-blue: #0A58CA;
            --primary-blue-hover: #084298;
            --accent-green: #25D366;
            --text-main: #111827;
            --text-light: #FFFFFF;
            --text-gray: #6B7280;
            --bg-light: #FFFFFF;
            --bg-offwhite: #F8FAFC;
            --border-light: #E5E7EB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-light); color: var(--text-main); line-height: 1.5; overflow-x: hidden; }

        /* --- Nav & Headers --- */
        .top-bar { background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: space-between; align-items: center; padding: 10px 50px; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .top-info { display: flex; gap: 25px; flex-wrap: wrap; }
        .top-info span { display: inline-flex; align-items: center; gap: 8px; color: #D1D5DB; }
        .top-info i { color: #60A5FA; }
        .navbar { background-color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-box img { height: 45px; object-fit: contain; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { text-decoration: none; color: #111827; font-weight: 700; font-size: 0.85rem; transition: 0.2s; text-transform: uppercase; }
        .nav-links a:hover { color: var(--primary-blue); }
        .nav-icons { display: flex; align-items: center; gap: 20px; font-size: 1.1rem; color: #111827; }
        .nav-icons i { cursor: pointer; transition: 0.2s; }
        .nav-icons i:hover { color: var(--primary-blue); }
        .cart-icon-wrapper { position: relative; cursor: pointer; }
        .cart-badge { position: absolute; top: -8px; right: -10px; background: var(--primary-blue); color: #FFF; font-size: 0.6rem; font-weight: bold; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

        /* --- Hero --- */
        .hero { background: linear-gradient(to right, rgba(7, 13, 24, 0.85) 0%, rgba(10, 22, 40, 0.75) 100%), url('https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; color: var(--text-light); text-align: center; padding: 80px 20px; display: flex; flex-direction: column; align-items: center; }
        .hero-logo-img { max-width: 400px; width: 100%; margin-bottom: 20px; border-radius: 12px;}
        .hero h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 15px; }

        /* --- Product Grid --- */
        .product-section { padding: 60px 50px; max-width: 1600px; margin: 0 auto; }
        .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 2px solid #F3F4F6; padding-bottom: 15px; }
        .section-header-row h2 { font-size: 1.8rem; font-weight: 800; color: #111827; text-transform: uppercase; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 12px; padding: 25px; display: flex; flex-direction: column; transition: 0.2s; cursor: pointer; position: relative;}
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); border-color: transparent; }
        .product-image-box { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .product-image-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .product-info h3 { font-size: 1.1rem; font-weight: 800; color: #111827; margin-bottom: 5px; }
        .product-info .price { font-size: 1.4rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 15px; }
        .badge-tag { position: absolute; top: 15px; left: 15px; padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #FFF; }
        .badge-new { background-color: #111827; }
        .badge-open { background-color: #DC2626; }
        .badge-esim { background-color: #D97706; }

        /* --- Modal --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #FFF; border-radius: 16px; width: 100%; max-width: 900px; display: flex; overflow: hidden; position: relative; animation: modalFadeIn 0.3s ease; }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-close { position: absolute; top: 20px; right: 20px; background: #F3F4F6; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10; }
        .modal-left { width: 50%; background: #F8FAFC; padding: 40px; display: flex; align-items: center; justify-content: center; }
        .modal-left img { max-width: 100%; max-height: 400px; object-fit: contain; }
        .modal-right { width: 50%; padding: 40px; display: flex; flex-direction: column; }
        .modal-title { font-size: 2rem; font-weight: 900; margin-bottom: 15px; color: #111827; line-height: 1.1;}
        .modal-price { font-size: 2.2rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 25px; }
        
        .variant-group { margin-bottom: 20px; }
        .variant-group h4 { font-size: 0.85rem; font-weight: 800; color: #374151; margin-bottom: 10px; text-transform: uppercase; }
        .variant-options { display: flex; gap: 10px; flex-wrap: wrap; }
        .var-btn { padding: 10px 16px; border: 2px solid #E5E7EB; border-radius: 8px; background: #FFF; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .var-btn:hover { border-color: var(--primary-blue); }
        .var-btn.active { background: var(--primary-blue); border-color: var(--primary-blue); color: #FFF; }
        
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #FFF; box-shadow: 0 0 0 1px #D1D5DB; cursor: pointer; transition: 0.2s; }
        .color-btn.active { box-shadow: 0 0 0 2px var(--primary-blue); }

        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: auto; padding-top: 20px;}
        .modal-cart-btn { padding: 16px; border-radius: 8px; background: #111827; color: #FFF; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .modal-cart-btn:hover { background: #1F2937; }
        .modal-buy-btn { padding: 16px; border-radius: 8px; background: var(--accent-green); color: #FFF; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .modal-buy-btn:hover { background: #20BA56; }

        /* --- Cart Drawer --- */
        .cart-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; backdrop-filter: blur(3px); }
        .cart-drawer { position: fixed; top: 0; right: -450px; width: 100%; max-width: 450px; height: 100%; background: #FFF; z-index: 3001; display: flex; flex-direction: column; transition: right 0.3s ease; box-shadow: -5px 0 25px rgba(0,0,0,0.1); }
        .cart-drawer.open { right: 0; }
        
        .cart-header { padding: 25px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 1.4rem; font-weight: 800; }
        .close-cart { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6B7280; }
        
        .cart-items { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .cart-item { display: flex; gap: 15px; padding-bottom: 20px; border-bottom: 1px solid #F3F4F6; }
        .cart-item-img { width: 70px; height: 70px; object-fit: contain; background: #F8FAFC; border-radius: 8px; padding: 5px; }
        .cart-item-details { flex: 1; }
        .cart-item-title { font-size: 0.95rem; font-weight: 700; color: #111827; }
        .cart-item-specs { font-size: 0.8rem; color: #6B7280; margin: 4px 0; }
        .cart-item-price { font-size: 1rem; font-weight: 800; color: var(--primary-blue); }
        .cart-item-remove { font-size: 0.8rem; color: #EF4444; background: none; border: none; cursor: pointer; font-weight: 600; margin-top: 5px;}
        
        .cart-empty { text-align: center; color: #6B7280; padding: 40px 0; font-weight: 500; }

        .cart-footer { padding: 25px; border-top: 1px solid var(--border-light); background: #F8FAFC; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: #111827; }
        .btn-checkout { width: 100%; padding: 16px; background: var(--primary-blue); color: #FFF; font-size: 1rem; font-weight: 800; text-transform: uppercase; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-checkout:hover { background: var(--primary-blue-hover); }
        .btn-view-cart { width: 100%; padding: 14px; background: transparent; color: #374151; font-size: 0.9rem; font-weight: 700; border: 2px solid #D1D5DB; border-radius: 8px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .modal-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .modal-left, .modal-right { width: 100%; }
            .product-section { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="logo-box"><img src="WhatsApp Image 2026-07-24 at 10.41.15 AM_2.jpeg" alt="Urban Connect TT Logo"></a>
        <ul class="nav-links">
            <li><a href="#" class="active">HOME</a></li>
            <li><a href="#shop">SHOP ALL</a></li>
        </ul>
        <div class="nav-icons">
            <div class="cart-icon-wrapper" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="navCartCount">0</span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <img src="WhatsApp Image 2026-07-24 at 10.41.15 AM_2.jpeg" alt="Urban Connect TT" class="hero-logo-img">
        <h1>SUMMER OF SAVINGS</h1>
    </section>

    <!-- Products -->
    <section class="product-section" id="shop">
        <div class="section-header-row">
            <h2>ALL DEVICES</h2>
        </div>
        <div class="product-grid" id="productGrid">
            <!-- Injected by JS -->
        </div>
    </section>

    <!-- Product Modal -->
    <div id="productModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal(event)"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-left">
                <img id="modalImage" src="" alt="Phone">
            </div>
            <div class="modal-right">
                <h2 class="modal-title" id="modalTitle">Phone Title</h2>
                <div class="modal-price" id="modalPrice">$0</div>
                
                <div class="variant-group">
                    <h4>Storage Options</h4>
                    <div class="variant-options" id="storageContainer"></div>
                </div>

                <div class="variant-group">
                    <h4>Color: <span id="colorName" style="color:var(--primary-blue); font-weight:700;"></span></h4>
                    <div class="variant-options" id="colorContainer"></div>
                </div>

                <div class="modal-actions">
                    <button class="modal-cart-btn" onclick="addCurrentToCart()"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
                    <button class="modal-buy-btn" onclick="buyNow()"><i class="fa-solid fa-bolt"></i> Buy Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <div class="cart-empty">Your cart is currently empty.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalAmount">TT$0</span>
            </div>
            <button class="btn-checkout" onclick="checkout()"><i class="fa-solid fa-lock"></i> Secure Checkout</button>
            <button class="btn-view-cart" onclick="toggleCart()">Continue Shopping</button>
        </div>
    </div>

    <script>
        // Common Color Palettes based on Apple Originals
        const colors12 = [
            { name: 'Black', hex: '#1F2020' }, { name: 'White', hex: '#F9F6EF' }, 
            { name: 'Product RED', hex: '#BA0C2E' }, { name: 'Blue', hex: '#003355' }
        ];
        const colorsPro12 = [
            { name: 'Pacific Blue', hex: '#2A3C4D' }, { name: 'Graphite', hex: '#4C4A46' }, 
            { name: 'Silver', hex: '#F3F4F5' }, { name: 'Gold', hex: '#F9E5C9' }
        ];
        const colors13 = [
            { name: 'Midnight', hex: '#171E27' }, { name: 'Starlight', hex: '#F9F6EF' }, 
            { name: 'Blue', hex: '#215E7C' }, { name: 'Pink', hex: '#FAD7DA' }
        ];
        const colorsPro13 = [
            { name: 'Sierra Blue', hex: '#A7C1D9' }, { name: 'Graphite', hex: '#4C4A46' }, 
            { name: 'Silver', hex: '#F3F4F5' }, { name: 'Gold', hex: '#F9E5C9' }
        ];
        const colors14 = [
            { name: 'Midnight', hex: '#171E27' }, { name: 'Starlight', hex: '#F9F6EF' }, 
            { name: 'Purple', hex: '#E5DAEA' }, { name: 'Blue', hex: '#A0B4C7' }
        ];
        const colorsPro14 = [
            { name: 'Deep Purple', hex: '#4B384F' }, { name: 'Space Black', hex: '#1C1C1E' }, 
            { name: 'Silver', hex: '#F2F3EE' }, { name: 'Gold', hex: '#F3E5CD' }
        ];
        const colors15 = [
            { name: 'Black', hex: '#353535' }, { name: 'Blue', hex: '#CEE3ED' }, 
            { name: 'Green', hex: '#D2E3D8' }, { name: 'Pink', hex: '#F8D8DE' }
        ];
        const colorsPro15 = [
            { name: 'Natural Titanium', hex: '#A8A6A1' }, { name: 'Blue Titanium', hex: '#2E3641' }, 
            { name: 'White Titanium', hex: '#F2F1ED' }, { name: 'Black Titanium', hex: '#1C1C1E' }
        ];

        // Full Inventory Data generated from "WhatsApp Image 2026-07-24 at 10.41.15 AM_2.jpeg"
        const inventory = [
            // OPEN BOX
            { id: '12m', name: 'iPhone 12 Mini', condition: 'OPEN BOX', badge: 'badge-open', colors: colors12, storage: [ { size: '128GB', price: 1499 } ] },
            { id: '12', name: 'iPhone 12', condition: 'OPEN BOX', badge: 'badge-open', colors: colors12, storage: [ { size: '64GB', price: 1499 }, { size: '128GB', price: 1799 } ] },
            { id: '12p', name: 'iPhone 12 Pro', condition: 'OPEN BOX', badge: 'badge-open', colors: colorsPro12, storage: [ { size: '256GB', price: 2299 } ] },
            { id: '12pm', name: 'iPhone 12 Pro Max', condition: 'OPEN BOX', badge: 'badge-open', colors: colorsPro12, storage: [ { size: '256GB', price: 2599 } ] },
            { id: '13m', name: 'iPhone 13 Mini', condition: 'OPEN BOX', badge: 'badge-open', colors: colors13, storage: [ { size: 'Base', price: 1899 } ] },
            { id: '13', name: 'iPhone 13', condition: 'OPEN BOX', badge: 'badge-open', colors: colors13, storage: [ { size: '128GB', price: 2199 }, { size: '256GB', price: 2399 } ] },
            { id: '13p', name: 'iPhone 13 Pro', condition: 'OPEN BOX', badge: 'badge-open', colors: colorsPro13, storage: [ { size: '256GB', price: 2999 } ] },
            { id: '13pm', name: 'iPhone 13 Pro Max', condition: 'OPEN BOX', badge: 'badge-open', colors: colorsPro13, storage: [ { size: '256GB', price: 3599 }, { size: '512GB', price: 3750 }, { size: '1TB', price: 3899 } ] },
            
            // ESIM
            { id: '14', name: 'iPhone 14', condition: 'ESIM', badge: 'badge-esim', colors: colors14, storage: [ { size: '128GB', price: 2499 }, { size: '256GB', price: 2699 } ] },
            { id: '14pl', name: 'iPhone 14 Plus', condition: 'ESIM', badge: 'badge-esim', colors: colors14, storage: [ { size: '256GB', price: 2799 } ] },
            { id: '14p', name: 'iPhone 14 Pro', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro14, storage: [ { size: '256GB', price: 3599 }, { size: '512GB', price: 3799 } ] },
            { id: '14pm', name: 'iPhone 14 Pro Max', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro14, storage: [ { size: '256GB', price: 4199 }, { size: '512GB', price: 4499 } ] },
            { id: '15', name: 'iPhone 15', condition: 'ESIM', badge: 'badge-esim', colors: colors15, storage: [ { size: '128GB', price: 3299 }, { size: '256GB', price: 3599 } ] },
            { id: '15pl', name: 'iPhone 15 Plus', condition: 'ESIM', badge: 'badge-esim', colors: colors15, storage: [ { size: '256GB', price: 3799 } ] },
            { id: '15p', name: 'iPhone 15 Pro', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro15, storage: [ { size: '256GB', price: 4399 }, { size: '512GB', price: 4599 } ] },
            { id: '15pm', name: 'iPhone 15 Pro Max', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro15, storage: [ { size: '256GB', price: 4899 }, { size: '512GB', price: 5199 } ] },
            { id: '16', name: 'iPhone 16', condition: 'ESIM', badge: 'badge-esim', colors: colors15, storage: [ { size: '128GB', price: 4499 }, { size: '256GB', price: 4799 } ] },
            { id: '16pl', name: 'iPhone 16 Plus', condition: 'ESIM', badge: 'badge-esim', colors: colors15, storage: [ { size: '256GB', price: 4999 } ] },
            { id: '16p', name: 'iPhone 16 Pro', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro15, storage: [ { size: '256GB', price: 5699 }, { size: '512GB', price: 5999 } ] },
            { id: '16pm', name: 'iPhone 16 Pro Max', condition: 'ESIM', badge: 'badge-esim', colors: colorsPro15, storage: [ { size: '256GB', price: 6399 }, { size: '512GB', price: 6999 } ] },
            
            // BRAND NEW / 17 Series
            { id: '17', name: 'iPhone 17', condition: 'OPEN BOX', badge: 'badge-open', colors: colors15, storage: [ { size: '256GB', price: 5999 } ] },
            { id: '17p', name: 'iPhone 17 Pro', condition: 'BRAND NEW', badge: 'badge-new', colors: colorsPro15, storage: [ { size: '256GB', price: 9599 }, { size: '512GB', price: 10599 } ] },
            { id: '17pm', name: 'iPhone 17 Pro Max', condition: 'BRAND NEW', badge: 'badge-new', colors: colorsPro15, storage: [ { size: '256GB', price: 10499 }, { size: '512GB', price: 11999 }, { size: '1TB', price: 13399 } ] }
        ];

        let currentSelection = { phone: null, storage: null, color: null };
        let cart = [];

        // Dynamic Image Generator using placehold.co mapped to real colors
        function getImageUrl(phoneName, colorHex, colorName) {
            const hex = colorHex.replace('#', '');
            const text = encodeURIComponent(`${phoneName}\n${colorName}`);
            const textCol = (parseInt(hex, 16) > 0xffffff/2) ? '000000' : 'FFFFFF';
            return `https://placehold.co/400x500/${hex}/${textCol}?text=${text}`;
        }

        // Render Product Grid
        function renderGrid() {
            const grid = document.getElementById('productGrid');
            inventory.forEach(phone => {
                const startPrice = phone.storage[0].price;
                const defColor = phone.colors[0];
                const img = getImageUrl(phone.name, defColor.hex, defColor.name);
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(phone);
                card.innerHTML = `
                    <span class="badge-tag ${phone.badge}">${phone.condition}</span>
                    <div class="product-image-box"><img src="${img}" alt="${phone.name}"></div>
                    <div class="product-info">
                        <h3>${phone.name}</h3>
                        <div class="price">From TT$${startPrice.toLocaleString()}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Logic
        function openModal(phone) {
            currentSelection.phone = phone;
            currentSelection.storage = phone.storage[0];
            currentSelection.color = phone.colors[0];

            document.getElementById('modalTitle').innerText = `${phone.name} - ${phone.condition}`;
            updateModalUI();
            
            document.getElementById('productModal').style.display = 'flex';
        }

        function updateModalUI() {
            // Price Update
            document.getElementById('modalPrice').innerText = `TT$${currentSelection.storage.price.toLocaleString()}`;
            
            // Image Update
            const imgUrl = getImageUrl(currentSelection.phone.name, currentSelection.color.hex, currentSelection.color.name);
            document.getElementById('modalImage').src = imgUrl;
            document.getElementById('colorName').innerText = currentSelection.color.name;

            // Storage Buttons
            const sContainer = document.getElementById('storageContainer');
            sContainer.innerHTML = '';
            currentSelection.phone.storage.forEach(s => {
                const btn = document.createElement('button');
                btn.className = `var-btn ${currentSelection.storage.size === s.size ? 'active' : ''}`;
                btn.innerText = s.size;
                btn.onclick = () => { currentSelection.storage = s; updateModalUI(); };
                sContainer.appendChild(btn);
            });

            // Color Buttons
            const cContainer = document.getElementById('colorContainer');
            cContainer.innerHTML = '';
            currentSelection.phone.colors.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `color-btn ${currentSelection.color.name === c.name ? 'active' : ''}`;
                btn.style.backgroundColor = c.hex;
                btn.onclick = () => { currentSelection.color = c; updateModalUI(); };
                cContainer.appendChild(btn);
            });
        }

        function closeModal(e) {
            if (e.target.id === 'productModal' || e.target.closest('.modal-close')) {
                document.getElementById('productModal').style.display = 'none';
            }
        }

        // Cart Logic
        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            if (drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                drawer.classList.add('open');
                overlay.style.display = 'block';
                renderCart();
            }
        }

        function addCurrentToCart() {
            const item = {
                id: Date.now(),
                name: currentSelection.phone.name,
                condition: currentSelection.phone.condition,
                storage: currentSelection.storage.size,
                color: currentSelection.color.name,
                price: currentSelection.storage.price,
                img: getImageUrl(currentSelection.phone.name, currentSelection.color.hex, currentSelection.color.name)
            };
            cart.push(item);
            updateCartCount();
            document.getElementById('productModal').style.display = 'none';
            toggleCart();
        }

        function buyNow() {
            addCurrentToCart();
            checkout();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCount();
            renderCart();
        }

        function updateCartCount() {
            document.getElementById('navCartCount').innerText = cart.length;
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const totalEl = document.getElementById('cartTotalAmount');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty">Your cart is currently empty.</div>';
                totalEl.innerText = 'TT$0';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <img src="${item.img}" class="cart-item-img">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name} (${item.condition})</div>
                        <div class="cart-item-specs">${item.storage} | ${item.color}</div>
                        <div class="cart-item-price">TT$${item.price.toLocaleString()}</div>
                        <button class="cart-item-remove" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                `;
                container.appendChild(el);
            });

            totalEl.innerText = `TT$${total.toLocaleString()}`;
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            // For now, simulate checkout
            alert("Proceeding to Secure Online Checkout with " + cart.length + " item(s).");
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
